; ============================================================================
;  C 盘安全清理工具 — 配置文件 (cleanup_config.ini)
;  说明：本文件用于指定「需要保留」的文件/路径，以及微调扫描范围。
;  重要：所有删除操作仍仅限于程序内置的「白名单安全目录」，
;        本配置无法放宽该限制，也不能用来添加系统关键目录进行删除。
;  修改后保存为 UTF-8 编码即可生效。
; ============================================================================

[Retain]
; ---- 保留路径：填写完整路径（支持 %LOCALAPPDATA% 等环境变量） ----
; 若填写目录，则该目录下所有内容都会被保留、不参与清理。
; Path=C:\Users\PC\AppData\Local\Temp\MyAppCache
; Path=%LOCALAPPDATA%\Temp\KeepMe

; ---- 保留文件名模式：支持通配符 * 和 ? ----
; Pattern=*.log
; Pattern=important*.tmp
; Pattern=*.pst

[SafeRoots]
; ---- 额外要扫描的安全根（必须是可安全清理的缓存/临时目录） ----
; 程序仍只会删除其中的文件，不会触及白名单之外的任何内容。
; Add=C:\MyApp\Cache
; Add=D:\OtherTemp

; ---- 关闭某个默认安全根（填写解析后的完整路径） ----
; Exclude=C:\Windows\Prefetch
; Exclude=C:\Windows\SoftwareDistribution\Download

[Options]
; ---- 仅删除「最后修改时间」超过该天数的文件；0 = 不限制 ----
; RetainFileAgeDays=7
RetainFileAgeDays=0

[AppCache]
; ============================================================================
;  应用缓存清理（自动识别常用软件产生的无用缓存/日志/更新残留）
;  仅清理「白名单内列出的具体缓存子目录」，绝不直接删除软件主目录；
;  各目录按 Patterns 限定可删文件类型（缓存目录默认 * 即全部，日志目录限 *.log 等）。
; ============================================================================
; 总开关：1/true = 启用（默认）；0/false/no = 关闭整个应用缓存清理功能
Enable=1

; ---- 按软件名排除（与下面 Name 一致，可填多个） ----
; ExcludeApp=Chrome 缓存
; ExcludeApp=微信 缓存

; ---- 按具体路径排除（支持环境变量，解析后的完整缓存目录） ----
; ExcludePath=%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache

; ---- 按文件模式排除（这些文件即使位于缓存目录也绝不删除） ----
; ExcludePattern=*.important
; ExcludePattern=*.db

[LargeFiles]
; ============================================================================
;  大文件扫描（「大文件扫描」标签页）
;  仅扫描 %USERPROFILE% 与 C:\Users\Public；系统目录、可执行/驱动类文件受保护，
;  删除动作一律送入回收站（可在回收站还原），不会永久删除。
; ============================================================================
; 阈值：只列出大于该值的文件（MB），最小 10
ThresholdMB=200
; 列表中最多显示多少个文件，最小 20
MaxItems=200

[AutoClean]
; ============================================================================
;  自动清理（「自动清理」标签页 / 静默模式 CleanCDrive.exe --autorun）
;  界面上的修改会自动写入本区块；也可手工编辑后由计划任务调用。
; ============================================================================
; 总开关：1 = 启用（计划任务到点执行时才会真正清理）；0 = 关闭
Enable=0
; 频率：DAILY（每日）/ WEEKLY（每周日）/ HOURLY（每小时）/ ONLOGON（每次登录）
Schedule=DAILY
; 执行时间，24 小时制 HH:MM（ONLOGON 可忽略）
Time=03:00
; 清理目标（逗号分隔）：system=系统临时文件，appcache=应用缓存，recycle=回收站
Targets=system,appcache
; 是否忽略电池状态继续执行（笔记本用）：1 = 忽略
IgnoreBattery=0


